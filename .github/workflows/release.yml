# Builds the Windows and macOS bundles, smoke-tests one with Docker (the
# whole stack plus the REST API test suite), and publishes a GitHub release.
#
# Publish: push a tag like v0.2.0, or run this workflow by hand with a version.
# Pull requests that touch the release files only build and test.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0 (the tag is created on the selected branch)'
        required: true
  pull_request:
    paths:
      - 'release/**'
      - 'scripts/build-release.sh'
      - '.github/workflows/release.yml'
      - 'api/docker/**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event_name == 'push' && github.ref_name || 'v0.0.0-pr' }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          if ! [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1 (got '$VERSION')"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web tests and type check
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck

      - name: Build the bundles
        run: scripts/build-release.sh "$VERSION"

      - name: Smoke-test the bundle with Docker
        run: |
          mkdir smoke
          unzip -q "dist-release/ona-web-$VERSION-macos.zip" -d smoke
          cd smoke/ona-web
          {
            echo "ONA_DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "ONA_DB_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          docker compose up -d --build --wait --wait-timeout 600
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/vlans | grep -q '<div id="root">'
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' http://localhost:8000/api/v1/auth/login >/dev/null
          curl -fsS -b jar http://localhost:8000/api/v1/vlans >/dev/null
          curl -fsS http://localhost:8080/ >/dev/null
          docker compose exec -T api php /opt/ona/rest/tests/run.php

      - name: Container logs
        if: failure()
        working-directory: smoke/ona-web
        run: docker compose logs --no-color --tail 200

      - name: Stop the containers
        if: always()
        working-directory: smoke/ona-web
        run: docker compose down -v || true

      - name: Keep the bundles
        uses: actions/upload-artifact@v4
        with:
          name: ona-web-${{ env.VERSION }}
          path: dist-release/

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          - **Windows:** \`ona-web-$VERSION-windows.zip\`. Unzip, then double-click \`start.bat\`.
          - **macOS:** \`ona-web-$VERSION-macos.zip\`. Unzip, then double-click \`start.command\` (the first time, right-click it and choose Open).

          Both need [Docker Desktop](https://www.docker.com/products/docker-desktop/) running. ona-web opens at http://localhost:8000 (log in as \`admin\` / \`admin\` and change the password under Admin); the classic ONA UI is at http://localhost:8080. Both ports are only reachable from your computer. See \`README.txt\` in the zip for settings, upgrading and troubleshooting.

          Checksums are in \`SHA256SUMS\`.
          EOF
          gh release create "$VERSION" dist-release/*.zip dist-release/SHA256SUMS \
            --title "ona-web $VERSION" --notes-file notes.md --target "$GITHUB_SHA" \
            $([[ $VERSION == *-* ]] && echo --prerelease)
