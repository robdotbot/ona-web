# Builds the Windows, macOS and Linux bundles, smoke-tests the Linux one with
# Docker through its own start.sh (the whole stack plus the REST API test
# suite), checks the other two hold the same stack, and publishes a release.
#
# Publish: push a tag like v0.2.0, or run this workflow by hand with a version.
# Pull requests that touch the release files only build and test.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0 (the tag is created on the selected branch)'
        required: true
  pull_request:
    paths:
      - 'release/**'
      - 'scripts/build-release.sh'
      - '.github/workflows/release.yml'
      - 'api/docker/**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event_name == 'push' && github.ref_name || 'v0.0.0-pr' }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          if ! [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1 (got '$VERSION')"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web tests and type check
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck

      - name: Build the bundles
        run: scripts/build-release.sh "$VERSION"

      - name: Smoke-test the Linux bundle with Docker (via its start.sh)
        env:
          CI: '1'
        run: |
          mkdir smoke
          tar -xzf "dist-release/ona-web-$VERSION-linux.tar.gz" -C smoke
          cd smoke/ona-web
          ./start.sh
          test -f .env
          docker compose ps
          curl -fsS http://localhost:8000/api/v1/health
          curl -fsS http://localhost:8000/vlans | grep -q '<div id="root">'
          curl -fsS -c jar -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' http://localhost:8000/api/v1/auth/login >/dev/null
          curl -fsS -b jar http://localhost:8000/api/v1/vlans >/dev/null
          curl -fsS http://localhost:8080/ >/dev/null
          docker compose exec -T api php /opt/ona/rest/tests/run.php

      - name: Check the Windows and macOS bundles match
        run: |
          # Same stack as the Linux bundle; only the launchers and README differ.
          for os in windows macos; do
            mkdir -p "cmp/$os" && unzip -q "dist-release/ona-web-$VERSION-$os.zip" -d "cmp/$os"
            diff -r --exclude='*.bat' --exclude='*.command' --exclude='*.sh' --exclude=README.txt --exclude=.env --exclude=jar \
              "cmp/$os/ona-web" smoke/ona-web
          done

      - name: Container logs
        if: failure()
        working-directory: smoke/ona-web
        run: docker compose logs --no-color --tail 200

      - name: Stop the containers
        if: always()
        working-directory: smoke/ona-web
        run: docker compose down -v || true

      - name: Keep the bundles
        uses: actions/upload-artifact@v4
        with:
          name: ona-web-${{ env.VERSION }}
          path: dist-release/

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          - **Windows:** \`ona-web-$VERSION-windows.zip\`. Unzip, then double-click \`start.bat\`.
          - **macOS:** \`ona-web-$VERSION-macos.zip\`. Unzip, then double-click \`start.command\` (the first time, right-click it and choose Open).
          - **Linux** (any distribution): \`ona-web-$VERSION-linux.tar.gz\`. Extract with \`tar -xzf\`, then run \`./start.sh\` (or \`sudo ./start.sh\` if you're not in the \`docker\` group).

          Windows and macOS need [Docker Desktop](https://www.docker.com/products/docker-desktop/) running; Linux needs [Docker Engine](https://docs.docker.com/engine/install/) with the Compose plugin (or Docker Desktop for Linux). ona-web opens at http://localhost:8000 (log in as \`admin\` / \`admin\` and change the password under Admin); the classic ONA UI is at http://localhost:8080. Both ports are only reachable from your computer. See \`README.txt\` in the download for settings, upgrading and troubleshooting.

          Checksums are in \`SHA256SUMS\`.
          EOF
          args=(--title "ona-web $VERSION" --notes-file notes.md --target "$GITHUB_SHA")
          if [[ $VERSION == *-* ]]; then args+=(--prerelease); fi
          gh release create "$VERSION" dist-release/*.zip dist-release/*.tar.gz dist-release/SHA256SUMS "${args[@]}"
