<VirtualHost *:80>
    DocumentRoot /opt/ona/www
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /opt/ona/www>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Only the front controller under www/api/v1 is web reachable; the REST
    # code itself lives in /opt/ona/rest, outside the document root.
    <Directory /opt/ona/www/api/v1>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L,QSA]
    </Directory>
</VirtualHost>
