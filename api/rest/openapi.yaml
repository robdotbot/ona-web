        '404': { $ref: '#/components/responses/NotFound' }


  /configs:
    get:
      tags: [configs]
      summary: Config archive entries, newest first, without the text (permission host_config_admin)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - { name: hostId, in: query, schema: { type: integer } }
        - { name: typeId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Config' } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [configs]
      summary: Archive a config (module config_add, permission host_config_admin)
      description: Send the config text itself; file names are not accepted.
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId, typeId, text]
              properties:
                  hostId: { type: integer }
                  typeId: { type: integer, description: A config type (GET /config-types) }
                  text: { type: string, maxLength: 4194304 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /configs/diff:
    get:
      tags: [configs]
      summary: Unified diff between two configs, older to newer (module config_diff, permission host_config_admin)
      parameters:
        - { name: from, in: query, required: true, schema: { type: integer } }
        - { name: to, in: query, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  from: { $ref: '#/components/schemas/Config' }
                  to: { $ref: '#/components/schemas/Config' }
                  diff: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

