        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Domain' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [domains]
      summary: Add a domain (module domain_add, permission advanced)
