openapi: 3.1.0
info:
  title: OpenNetAdmin REST API
  version: 1.0.0
  description: |
    JSON API over OpenNetAdmin (ONA). Every write runs the matching ONA DCM
    module through `run_module()`, so ONA's own validation, permission checks
    (`auth()`) and schema apply. The exceptions are the tables ONA has no
    module for (users, groups, permissions, system configuration, custom
    attribute types, reference data, changing or deleting messages): those
    are written directly, with the same permission checks as the classic
    admin windows.

    **Authentication.** `POST /auth/login` with an ONA username and password
    starts a session (cookie `ONA_SESSION_ID`). Every other endpoint except
    `/health` and this spec requires that session. There is no guest
    auto-login.

    **CSRF.** Every `POST`, `PATCH` and `DELETE` (except login) must send the
    session's token, from the login response or `GET /auth/session`, in an
    `X-CSRF-Token` header. Request bodies must be `application/json`.

    **Errors** always look like
    `{"error": {"code": "...", "message": "...", "details": {...}}}`.

    **Lists** take `page` (from 1), `perPage` (1-200) and `sort`
    (a field name, prefix `-` for descending) and return
    `{"data": [...], "meta": {"page", "perPage", "total", "totalPages"}}`.
servers:
  - url: /api/v1
security:
  - session: []
tags:
  - name: auth
  - name: subnets
  - name: hosts
  - name: interfaces
  - name: dns
  - name: vlans
  - name: blocks
  - name: dhcp
  - name: custom-attributes
  - name: locations
  - name: domains
  - name: admin
  - name: tags
  - name: messages
  - name: configs
  - name: reports
  - name: reference
  - name: search

paths:
  /health:
    get:
      tags: [auth]
      summary: Liveness check (no auth)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: v19.0.3 }

  /openapi.yaml:
    get:
      tags: [auth]
      summary: This specification (no auth)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            application/yaml: {}

  /auth/login:
    post:
      tags: [auth]
      summary: Log in with an ONA user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password, example: admin }
      responses:
        '200':
          description: Logged in; sets the session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the session
      description: Requires `X-CSRF-Token` when a session is active.
      security: []
      responses:
        '204': { description: Logged out }

  /auth/session:
    get:
      tags: [auth]
      summary: Current user, permissions and CSRF token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    post:
      tags: [auth]
      summary: Change your own password (local ONA users only)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                  currentPassword: { type: string }
                  newPassword: { type: string, maxLength: 1024 }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /stats:
    get:
      tags: [search]
      summary: Record counts for the home page
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    description: subnets, hosts, interfaces, dnsRecords, domains, vlans, vlanCampuses, blocks, locations, dhcpPools, customAttributes, dhcpServers, dnsServers, activeMessages
                    additionalProperties: { type: integer }
                  version: { type: [string, 'null'], description: ONA version }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    get:
      tags: [search]
      summary: Global search across hosts, subnets, interfaces and DNS records
      description: |
        An IP address finds the interface, its host, the containing subnet and
        records on that address. A MAC address finds interfaces and hosts.
        Anything else is matched against host, subnet and record names.
        Each group returns at most 10 items.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /subnets:
    get:
      tags: [subnets]
      summary: List subnets with IP usage
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          schema: { type: string, enum: [ip, -ip, name, -name, type, -type], default: ip }
        - name: q
          in: query
          description: Name substring, or an IP address to find the subnet containing it
          schema: { type: string }
        - { name: typeId, in: query, schema: { type: integer } }
        - { name: vlanId, in: query, schema: { type: integer } }
        - { name: ipFrom, in: query, description: Network address at or above this IP, schema: { type: string } }
        - { name: ipTo, in: query, description: Network address at or below this IP, schema: { type: string } }
        - { name: tag, in: query, description: Tag name, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Subnet' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [subnets]
      summary: Add a subnet (module subnet_add, permission subnet_add)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ip, netmask, typeId]
              properties:
                name: { type: string, description: 'Stored upper case, spaces become -', example: LAN-1 }
                ip: { type: string, example: 10.1.0.0 }
                netmask: { type: string, description: 'Prefix length (24 or /24) or dotted mask', example: '24' }
                typeId: { type: integer, example: 13 }
                vlanId: { type: integer, description: VLAN to assign the subnet to }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubnetDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /subnets/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [subnets]
      summary: Get a subnet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubnetDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [subnets]
      summary: Change a subnet (module subnet_modify, permission subnet_modify)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                ip: { type: string }
                netmask: { type: string }
                typeId: { type: integer }
                vlanId: { type: integer, description: VLAN to assign the subnet to; 0 detaches it }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubnetDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [subnets]
      summary: Delete a subnet (module subnet_del, permission subnet_del)
      description: |
        Follows ONA's rules: also removes DHCP pools and server assignments on
        the subnet, its interfaces, and hosts whose only interface is on it.
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /subnets/{id}/next-ip:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [subnets]
      summary: First unused address on the subnet (module subnet_nextip)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ip: { type: string, example: 10.1.0.1 }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /subnets/{id}/map:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [subnets]
      summary: Address map of an IPv4 subnet (up to /20)
      description: Used addresses and DHCP pools as offsets from the network address; the client draws the grid. 422 `unsupported` for IPv6 or larger subnets.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubnetMap' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /subnets/{id}/addresses:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [subnets]
      summary: Every address of a subnet in order, with its status (the classic "List by IP")
      description: |
        Works for any subnet size, IPv6 included. `meta.total` and
        `meta.totalPages` are strings when they don't fit a 64-bit integer.
        `status=free` leaves out used, DHCP pool and (IPv4) network/broadcast
        addresses.
      parameters:
        - $ref: '#/components/parameters/page'
        - { name: perPage, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 256 } }
        - { name: status, in: query, schema: { type: string, enum: [all, used, free], default: all } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ip: { type: string }
                        status: { type: string, enum: [used, free, pool, reserved] }
                        interfaceId: { type: [integer, 'null'] }
                        host: { oneOf: [ { $ref: '#/components/schemas/HostRef' }, { type: 'null' } ] }
                        poolId: { type: [integer, 'null'] }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      perPage: { type: integer }
                      total: { type: [integer, string] }
                      totalPages: { type: [integer, string] }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hosts:
    get:
      tags: [hosts]
      summary: List hosts
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - name: sort
          in: query
          schema: { type: string, enum: [name, -name, ip, -ip, id, -id], default: name }
        - name: q
          in: query
          description: Host name (optionally with domain), notes, IP address or MAC address
          schema: { type: string }
        - { name: subnetId, in: query, schema: { type: integer } }
        - { name: domainId, in: query, schema: { type: integer } }
        - { name: deviceTypeId, in: query, schema: { type: integer } }
        - { name: locationId, in: query, schema: { type: integer } }
        - { name: ipFrom, in: query, description: Hosts with an interface at or above this IP, schema: { type: string } }
        - { name: ipTo, in: query, description: Hosts with an interface at or below this IP, schema: { type: string } }
        - { name: tag, in: query, description: Tag name, schema: { type: string } }
        - { name: caTypeId, in: query, description: Hosts with a custom attribute of this type, schema: { type: integer } }
        - { name: caValue, in: query, description: '...whose value contains this (with caTypeId)', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Host' } }
    post:
      tags: [hosts]
      summary: Add a host with its first interface (module host_add, permission host_add)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, deviceTypeId, ip]
              properties:
                name: { type: string, description: 'Host name or FQDN; the default domain is used when no domain is given', example: web01.example.com }
                deviceTypeId: { type: integer }
                ip: { type: string, description: Must be inside an existing subnet }
                notes: { type: string }
                locationId: { type: integer }
                mac: { type: string }
                interfaceName: { type: string, example: eth0 }
                interfaceDescription: { type: string }
                addPtr: { type: boolean, default: false, description: Also add a PTR record (needs a matching in-addr.arpa domain) }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /hosts/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [hosts]
      summary: Get a host with its interfaces and DNS records
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [hosts]
      summary: Change a host (modules host_modify and dns_record_modify, permission host_modify)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, description: Renames the host's primary DNS record }
                deviceTypeId: { type: integer }
                notes: { type: string }
                locationId: { type: integer, description: 0 clears the location }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [hosts]
      summary: Delete a host and its interfaces and records (module host_del, permission host_del)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /interfaces:
    get:
      tags: [interfaces]
      summary: List interfaces (IP addresses)
      parameters:
        - $ref: '#/components/parameters/page'
        - name: perPage
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: sort
          in: query
          schema: { type: string, enum: [ip, -ip, name, -name, host, -host], default: ip }
        - { name: hostId, in: query, schema: { type: integer } }
        - { name: subnetId, in: query, schema: { type: integer } }
        - { name: q, in: query, description: 'IP, MAC, or name/description/host substring', schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Interface' } }
    post:
      tags: [interfaces]
      summary: Add an interface to a host (module interface_add, permission host_add)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId, ip]
              properties:
                hostId: { type: integer }
                ip: { type: string }
                mac: { type: string }
                name: { type: string }
                description: { type: string }
                addPtr: { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /interfaces/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [interfaces]
      summary: Get an interface
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [interfaces]
      summary: Change an interface (module interface_modify, permission interface_modify)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                ip: { type: string }
                mac: { type: string }
                name: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [interfaces]
      summary: Delete an interface (module interface_del, permissions interface_del and host_del)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /hosts/{id}/actions:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [hosts]
      summary: Links to outside tools for a host (the classic "Host actions")
      description: |
        Configured as in classic ONA: www/workspace_plugins/builtin/host_actions/config.inc.php,
        overridden by www/local/config/host_actions.config.php. URLs can use %fqdn, %ip, %loc,
        %hostname, %onahostname, %domain, %onadomain and %ca[attribute] (falling back to the
        sys_config value default_<attribute>). A link whose placeholders have no value for the
        host is left out, and javascript:, data:, vbscript: and file: URLs are never returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        title: { type: string }
                        url: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /interfaces/move:
    post:
      tags: [interfaces]
      summary: Move the interfaces in an address range to another subnet (module interface_move, permission interface_modify)
      description: |
        IPv4 only. The interfaces between `start` and `end` (one subnet) get
        the free addresses from `newStart` to `newEnd` (another subnet), in
        order, skipping DHCP pools. Without `commit` nothing changes and the
        response lists what would move.
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start, newStart]
              properties:
                  start: { type: string }
                  end: { type: string, description: Defaults to start }
                  newStart: { type: string }
                  newEnd: { type: string, description: Defaults to newStart }
                  commit: { type: boolean, default: false }
      responses:
        '200':
          description: Preview or result
          content:
            application/json:
              schema:
                type: object
                properties:
                  committed: { type: boolean }
                  moves:
                    type: array
                    items:
                      type: object
                      properties:
                        from: { type: string }
                        to: { type: string }
                        host: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /interfaces/{id}/move:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [interfaces]
      summary: Move an interface to another host (module interface_move_host, permission advanced)
      description: The host's primary interface can't be moved (422).
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId]
              properties:
                  hostId: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /interfaces/{id}/shares:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    post:
      tags: [interfaces]
      summary: Share the interface's address with another host, e.g. for VRRP/HSRP/CARP (module interface_share, permission interface_del)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId]
              properties:
                  hostId: { type: integer }
                  name: { type: string, description: Interface name on that host, if different }
      responses:
        '201':
          description: Shared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Interface' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /interfaces/{id}/shares/{hostId}:
    parameters:
      - { $ref: '#/components/parameters/id' }
      - { name: hostId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [interfaces]
      summary: Stop sharing the interface with a host (module interface_share_del, permission interface_del)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
