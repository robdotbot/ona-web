      tags: [domains]
      summary: Remove a DNS server from a domain (module domain_server_del, permission advanced)
      description: Also deletes the server's NS record in the domain.
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


