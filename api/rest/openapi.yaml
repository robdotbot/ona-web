              properties:
                name: { type: string, example: lab, description: "The domain's own name; with parentId it becomes lab.<parent>" }
                parentId: { type: integer }
                primaryMaster: { type: string }
                adminEmail: { type: string }
                refresh: { type: integer }
                retry: { type: integer }
                expiry: { type: integer }
                minimum: { type: integer }
                defaultTtl: { type: integer }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /domains/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [domains]
      summary: Get a domain
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [domains]
      summary: Change a domain (module domain_modify, permission advanced)
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                parentId: { type: integer, description: 0 makes it a top-level domain }
                primaryMaster: { type: string }
                adminEmail: { type: string }
                refresh: { type: integer }
                retry: { type: integer }
                expiry: { type: integer }
                minimum: { type: integer }
                defaultTtl: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Domain' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [domains]
      summary: Delete a domain (module domain_del, permission advanced)
      description: |
        Refused with 409 while DNS records use the domain or it has child domains.
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Deleted }
