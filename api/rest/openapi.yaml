      parameters:
        - { name: hostId, in: query, schema: { type: integer } }
        - { name: subnetId, in: query, schema: { type: integer } }
        - { name: name, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        '400': { $ref: '#/components/responses/Error' }
    post:
      tags: [tags]
      summary: Tag a host (permission host_add) or subnet (permission subnet_add) (module tag_add)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
