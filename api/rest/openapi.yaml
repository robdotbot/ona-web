      tags: [messages]
      summary: Add a message (module message_add, permission advanced)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                  hostId: { type: integer }
                  subnetId: { type: integer }
                  message: { type: string, maxLength: 4000 }
                  priority: { type: integer, minimum: 0, maximum: 3, default: 3 }
                  expiration: { type: string, description: 'YYYY-MM-DD[ HH:MM[:SS]]; default six weeks from now' }
      responses:
        '201':
          description: Created
