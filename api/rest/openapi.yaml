  /reports:
    get:
      tags: [reports]
      summary: Reports provided by enabled plugins (module report_run list)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: ona_nmap_scans }
                        description: { type: string }
  /reports/{key}:
    parameters: [ { $ref: '#/components/parameters/key' } ]
    get:
      tags: [reports]
      summary: A report's usage text (report_run rpt_usage)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string }
                  usage: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/{key}/run:
    parameters: [ { $ref: '#/components/parameters/key' } ]
    post:
      tags: [reports]
      summary: Run a report as text or CSV (module report_run)
      description: |
        Only report names from GET /reports are accepted and only the text
        and CSV formats (never a plugin's HTML). `params` are the report's own
        options (see its usage text); names are lower case letters, digits
        and `_`, values strings, numbers or `true`. Reports that change data
        rely on the modules they call to check permissions.
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  format: { type: string, enum: [text, csv], default: text }
                  params: { type: object, additionalProperties: { type: [string, integer, boolean] } }
      responses:
        '200':
          description: Report output
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  format: { type: string }
                  output: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }


