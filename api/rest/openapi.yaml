        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domainId, hostId]
              properties:
                  domainId: { type: integer }
                  hostId: { type: integer }
                  role: { type: string, enum: [master, slave, forward], default: master }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomainServer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

