      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                  name: { type: string, maxLength: 63 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigType' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /config-types/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [reference]
      summary: Get one of the config archive types
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigType' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [reference]
      summary: Change one of the config archive types (permission advanced)
      description: Built-in rows (system DHCP options, the default DNS view) can't be changed (409).
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  name: { type: string, maxLength: 63 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigType' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [reference]
      summary: Delete one of the config archive types (permission advanced)
      description: Rows still in use (`inUse` > 0) and built-in rows can't be deleted (409).
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /dns-views:
    get:
      tags: [reference]
      summary: List DNS views (split horizon)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DnsView' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [reference]
      summary: Add one of the DNS views (split horizon) (permission advanced)
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                  name: { type: string, maxLength: 191, description: 'Stored upper case, spaces become -' }
                  description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /dns-views/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [reference]
      summary: Get one of the DNS views (split horizon)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [reference]
      summary: Change one of the DNS views (split horizon) (permission advanced)
      description: Built-in rows (system DHCP options, the default DNS view) can't be changed (409).
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  name: { type: string, maxLength: 191, description: 'Stored upper case, spaces become -' }
                  description: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DnsView' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [reference]
      summary: Delete one of the DNS views (split horizon) (permission advanced)
      description: Rows still in use (`inUse` > 0) and built-in rows can't be deleted (409).
      parameters: [ { $ref: '#/components/parameters/csrf' } ]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users:
    get:
      tags: [admin]
      summary: List users
      description: |
        Needs `user_admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Add a user (permission user_admin)
      description: |
        ONA has no module for this; written directly, like the classic admin window. Changes take effect at the next login.
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9.\-_]+$' }
                password: { type: string, format: password, description: "Stored as ONA stores local passwords (unsalted MD5)" }
                groupIds: { type: array, items: { type: integer } }
                permissions: { type: array, items: { type: string }, description: "Permissions granted directly, in addition to the groups" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [admin]
      summary: Get a user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      summary: Change a user (permission user_admin)
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                username: { type: string }
                password: { type: string, format: password }
                groupIds: { type: array, items: { type: integer }, description: "Replaces the group list" }
                permissions: { type: array, items: { type: string }, description: "Replaces the direct permissions" }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      summary: Delete a user (permission user_admin)
      description: |
        You cannot delete the user you are logged in as (409).
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /groups:
    get:
      tags: [admin]
      summary: List groups
      description: |
        Needs `user_admin`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Group' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Add a group (permission user_admin)
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                permissions: { type: array, items: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /groups/{id}:
    parameters: [ { $ref: '#/components/parameters/id' } ]
    get:
      tags: [admin]
      summary: Get a group
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      summary: Change a group (permission user_admin)
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                description: { type: string }
                permissions: { type: array, items: { type: string }, description: "Replaces the group permissions" }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      summary: Delete a group (permission user_admin)
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /permissions:
    get:
      tags: [admin]
      summary: Permission names (needs user_admin)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /sys-config:
    get:
      tags: [admin]
      summary: List system configuration entries
      description: |
        Needs `advanced`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SysConfig' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      summary: Add a system configuration entry (permission advanced)
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: '^[A-Za-z0-9_]+$' }
                value: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SysConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /sys-config/{key}:
    parameters: [ { $ref: '#/components/parameters/key' } ]
    get:
      tags: [admin]
      summary: Get a system configuration entry
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SysConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      summary: Change a system configuration entry (permission advanced)
      description: |
        Refused with 409 for entries ONA marks as not editable.
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                value: { type: string, description: "Must match the entry's validation rule" }
                description: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SysConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      summary: Delete a system configuration entry (permission advanced)
      description: |
        Refused with 409 for entries ONA marks as not deleteable.
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /change-log:
    get:
      tags: [admin]
      summary: The ONA change log (table ona_logs, permission advanced)
      description: ONA only writes it when the `log_to_db` system setting is 1; `meta.logToDb` says whether it is on.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/perPage'
        - { name: sort, in: query, schema: { type: string, enum: [timestamp, -timestamp, username, -username], default: -timestamp } }
        - { name: q, in: query, description: Message substring, schema: { type: string } }
        - { name: username, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListMeta'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /plugins:
    get:
      tags: [admin]
      summary: Installed plugins (needs advanced)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Plugin' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /plugins/{key}:
    parameters: [ { $ref: '#/components/parameters/key' } ]
    patch:
      tags: [admin]
      summary: Enable or disable a plugin (permission advanced)
      description: |
        Uses the same `plugin_disabled` marker file as the classic UI. 409 if the plugin directory is not writable by the web server. Running a plugin installer stays in the classic UI.
      parameters:
        - { $ref: '#/components/parameters/csrf' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ONA_SESSION_ID

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    perPage:
      name: perPage
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
    key:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' }
    csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Not logged in (code `unauthorized`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Missing ONA permission (code `forbidden`, `details.permission`) or bad CSRF token (code `csrf_failed`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such record (code `not_found`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: ONA refused because the change clashes with existing data (code `conflict`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: |
        Invalid input (code `validation_failed`, `details.fields`) or the ONA
        module refused the change (code `module_error`, `details.output`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, forbidden, csrf_failed, not_found, method_not_allowed,
                     conflict, unsupported_media_type, validation_failed, module_error, internal_error,
                     not_implemented, not_installed, database_unavailable]
            message: { type: string }
            details: { type: object, additionalProperties: true }

    ListMeta:
      type: object
      properties:
        meta:
          type: object
          properties:
            page: { type: integer }
            perPage: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            username: { type: string }
            groups: { type: array, items: { type: string } }
        permissions:
          type: array
          items: { type: string }
          example: [host_add, host_del, host_modify, subnet_add]
        csrfToken: { type: string }

    Ref:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    Subnet:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: LAN-1 }
        ip: { type: string, example: 10.1.0.0 }
        cidr: { type: integer, example: 24 }
        netmask: { type: string, example: 255.255.255.0 }
        network: { type: string, example: 10.1.0.0/24 }
        ipVersion: { type: integer, enum: [4, 6] }
        type: { oneOf: [ { $ref: '#/components/schemas/Ref' }, { type: 'null' } ] }
        usage:
          type: object
          description: Addresses used by interfaces and DHCP pools, as computed by ONA's get_subnet_usage()
          properties:
            used: { type: integer }
            total: { type: string, description: Usable addresses (a string because IPv6 sizes overflow integers) }
            percent: { type: integer }
        tags: { type: array, items: { type: string } }

    SubnetDetail:
      allOf:
        - $ref: '#/components/schemas/Subnet'
        - type: object
          properties:
            vlan:
              oneOf:
                - type: 'null'
                - type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    number: { type: integer }
                    campus: { type: string }
            firstIp: { type: string }
            lastIp: { type: string }
            interfaceCount: { type: integer }
            hostCount: { type: integer }

    Host:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: web01 }
        fqdn: { type: string, example: web01.example.com }
        domain: { $ref: '#/components/schemas/Ref' }
        primaryIp: { type: [string, 'null'] }
        primaryInterfaceId: { type: [integer, 'null'] }
        interfaceCount: { type: integer }
        notes: { type: string }
        deviceType:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                name: { type: string, example: Cisco 2821 (router) }
                manufacturer: { type: string }
                model: { type: string }
                role: { type: string }
        location:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                reference: { type: string }
                name: { type: string }
                city: { type: string }
        tags: { type: array, items: { type: string } }

    HostDetail:
      allOf:
        - $ref: '#/components/schemas/Host'
        - type: object
          properties:
            primaryDnsId: { type: integer }
            interfaces:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Interface'
                  - type: object
                    properties:
                      sharedWith: { $ref: '#/components/schemas/InterfaceShares' }
            sharedInterfaces: { type: array, description: Other hosts' interfaces shared with this host, items: { $ref: '#/components/schemas/Interface' } }
            services:
              type: object
              description: What the host serves
              properties:
                dnsDomains:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: integer, description: DNS server assignment ID }
                      domain: { $ref: '#/components/schemas/Ref' }
                      role: { type: string, enum: [master, slave, forward] }
                dhcpSubnets:
                  type: array
                  items: { type: object, properties: { id: { type: integer }, name: { type: string }, network: { type: string } } }
                dhcpFailoverGroupIds: { type: array, items: { type: integer } }
            dnsRecords: { type: array, items: { $ref: '#/components/schemas/DnsRecord' } }

    InterfaceShares:
      type: array
      description: Hosts the address is shared with (interface_clusters); only on single-interface and host detail responses
      items:
        type: object
        properties:
          hostId: { type: integer }
          fqdn: { type: string }
          name: { type: string }

    Interface:
      type: object
      properties:
        id: { type: integer }
        ip: { type: string }
        ipVersion: { type: integer, enum: [4, 6] }
        mac: { type: [string, 'null'], example: '00:11:22:33:44:55' }
        name: { type: string }
        description: { type: [string, 'null'] }
        lastResponse: { type: [string, 'null'] }
        natInterfaceId: { type: [integer, 'null'], description: The external NAT address's interface }
        sharedWith: { $ref: '#/components/schemas/InterfaceShares' }
        host:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                fqdn: { type: string }
        subnet:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
                network: { type: string }

    DnsType:
      type: string
      enum: [A, AAAA, CNAME, MX, NS, PTR, SRV, TXT]

    DnsRecordFields:
      type: object
      properties:
        ip: { type: string, description: A/AAAA/PTR address (must belong to an existing interface) }
        pointsTo: { type: string, description: Target FQDN for CNAME, MX, NS, SRV }
        ttl: { type: integer, description: 0 uses the domain default }
        notes: { type: string }
        mxPreference: { type: integer }
        txt: { type: string }
        srvPriority: { type: integer }
        srvWeight: { type: integer }
        srvPort: { type: integer }
        enabled: { type: boolean, description: 'false disables the record (ONA moves its begin date to 2038-01-19); true enables it now' }
        activeFrom: { type: string, description: 'Enable from this date (YYYY-MM-DD[ HH:MM[:SS]]), e.g. a scheduled change' }
        viewId: { type: integer, description: 'DNS view (split horizon); 0 is the default view. Child records follow their parent' }

    DnsRecord:
      type: object
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/DnsType' }
        name: { type: string }
        fqdn: { type: string }
        domain: { $ref: '#/components/schemas/Ref' }
        ttl: { type: integer }
        ip: { type: [string, 'null'] }
        interfaceId: { type: [integer, 'null'] }
        hostId: { type: [integer, 'null'] }
        pointsTo:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: integer }
                fqdn: { type: string }
        notes: { type: string }
        enabled: { type: boolean, description: Active now (begin date not in the future) }
        activeFrom: { type: [string, 'null'], description: Begin date; null when disabled }
        view: { $ref: '#/components/schemas/Ref' }
        mxPreference: { type: [integer, 'null'] }
        txt: { type: [string, 'null'] }
        srv:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                priority: { type: integer }
                weight: { type: integer }
                port: { type: integer }

    VlanCampus:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: MAIN }
        vlanCount: { type: integer }

    Vlan:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: SERVERS }
        number: { type: integer, example: 10 }
        campus: { $ref: '#/components/schemas/Ref' }
        subnetCount: { type: integer }

    VlanDetail:
      allOf:
        - $ref: '#/components/schemas/Vlan'
        - type: object
          properties:
            subnets: { type: array, items: { $ref: '#/components/schemas/Subnet' } }

    Block:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: DATACENTER-1 }
        start: { type: string, example: 10.0.0.0 }
        end: { type: string, example: 10.0.255.255 }
        ipVersion: { type: integer, enum: [4, 6] }
        size: { type: string, description: Number of addresses (a string because IPv6 sizes overflow integers) }
        notes: { type: string }

    BlockDetail:
      allOf:
        - $ref: '#/components/schemas/Block'
        - type: object
          properties:
            subnets: { type: array, description: Subnets starting inside the block, items: { $ref: '#/components/schemas/Subnet' } }

    HostRef:
      type: object
      properties:
        id: { type: integer }
        fqdn: { type: string }

    DhcpServer:
      type: object
      properties:
        id: { type: integer, description: The server's host ID }
        host:
          type: object
          properties:
            id: { type: integer }
            fqdn: { type: string }
            primaryIp: { type: [string, 'null'] }
        subnetCount: { type: integer }

    DhcpServerDetail:
      allOf:
        - $ref: '#/components/schemas/DhcpServer'
        - type: object
          properties:
            subnets: { type: array, items: { $ref: '#/components/schemas/Subnet' } }
            failoverGroups: { type: array, items: { $ref: '#/components/schemas/DhcpFailoverGroup' } }
            options: { type: array, items: { $ref: '#/components/schemas/DhcpEntry' } }

    DhcpFailoverGroup:
      type: object
      properties:
        id: { type: integer }
        primaryServer: { oneOf: [ { $ref: '#/components/schemas/HostRef' }, { type: 'null' } ] }
        secondaryServer: { oneOf: [ { $ref: '#/components/schemas/HostRef' }, { type: 'null' } ] }
        responseDelay: { type: integer }
        unackedUpdates: { type: integer }
        maxBalance: { type: integer }
        primaryPort: { type: integer }
        peerPort: { type: integer }
        mclt: { type: integer }
        split: { type: integer }

    DhcpFailoverGroupDetail:
      allOf:
        - $ref: '#/components/schemas/DhcpFailoverGroup'
        - type: object
          properties:
            pools: { type: array, items: { $ref: '#/components/schemas/DhcpPool' } }

    DhcpPool:
      type: object
      properties:
        id: { type: integer }
        subnet: { oneOf: [ { $ref: '#/components/schemas/Ref' }, { type: 'null' } ] }
        failoverGroupId: { type: [integer, 'null'] }
        start: { type: string, example: 10.1.0.100 }
        end: { type: string, example: 10.1.0.200 }
        size: { type: integer }
        leaseLength: { type: integer }
        leaseGrace: { type: integer }
        leaseRenewal: { type: integer }
        leaseRebind: { type: integer }

    DhcpOption:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: routers }
        displayName: { type: string, example: Default Gateway }
        number: { type: integer, example: 3 }
        type: { type: string, enum: [L, S, N, I, B] }
        typeName: { type: string, example: IP address list }
        system: { type: boolean, description: Built in; can't be changed or deleted }
        inUse: { type: integer }

    DhcpEntry:
      type: object
      properties:
        id: { type: integer }
        option:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            displayName: { type: string }
            number: { type: integer }
            type: { type: string }
        value: { type: string }
        scope: { type: string, enum: [global, subnet, host, server] }
        target: { oneOf: [ { $ref: '#/components/schemas/Ref' }, { type: 'null' } ], description: The subnet or host (name is its FQDN); null for global }

    CustomAttributeType:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: nmap_scan }
        notes: { type: string }
        validationRule: { type: string, example: '/^[YN]$/' }
        failedRuleText: { type: string }
        useCount: { type: integer }

    CustomAttribute:
      type: object
      properties:
        id: { type: integer }
        type: { $ref: '#/components/schemas/Ref' }
        value: { type: string }
        target:
          type: object
          properties:
            kind: { type: string, enum: [host, subnet, vlan] }
            id: { type: integer }

    Location:
      type: object
      properties:
        id: { type: integer }
        reference: { type: string, example: HQ }
        name: { type: string, example: Head office }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zipCode: { type: [integer, 'null'] }
        latitude: { type: string }
        longitude: { type: string }
        misc: { type: string }
        deviceCount: { type: integer }

    Domain:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: Full name, example: lab.example.com }
        shortName: { type: string, description: The domain's own label(s), example: lab }
        parent: { oneOf: [ { $ref: '#/components/schemas/Ref' }, { type: 'null' } ] }
        primaryMaster: { type: string }
        adminEmail: { type: string }
        serial: { type: integer }
        refresh: { type: integer }
        retry: { type: integer }
        expiry: { type: integer }
        minimum: { type: integer }
        defaultTtl: { type: integer }
        recordCount: { type: integer }
        servers:
          type: array
          description: DNS servers for the domain (see /domain-servers)
          items:
            type: object
            properties:
              id: { type: integer, description: Assignment ID }
              server: { $ref: '#/components/schemas/HostRef' }
              role: { type: string, enum: [master, slave, forward] }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        level: { type: integer }
        createdAt: { type: [string, 'null'] }
        lastLoginAt: { type: [string, 'null'] }
        groups: { type: array, items: { $ref: '#/components/schemas/Ref' } }
        permissions: { type: array, description: Permissions granted directly (not through groups), items: { type: string } }

    Group:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        memberCount: { type: integer }
        permissions: { type: array, items: { type: string } }

    GroupDetail:
      allOf:
        - $ref: '#/components/schemas/Group'
        - type: object
          properties:
            members:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  username: { type: string }

    Permission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: host_add }
        description: { type: string }

    SysConfig:
      type: object
      properties:
        name: { type: string, example: dns_defaultdomain }
        value: { type: string }
        description: { type: string }
        validationRule: { type: string }
        failedRuleText: { type: string }
        editable: { type: boolean }
        deleteable: { type: boolean }

    Plugin:
      type: object
      properties:
        name: { type: string, example: ona_nmap_scans }
        version: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        helpUrl: { type: [string, 'null'] }
        enabled: { type: boolean }
        hasInstaller: { type: boolean, description: The plugin has an install step (run it from the classic UI) }
        local: { type: boolean, description: Installed under www/local/plugins }

    SubnetMap:
      type: object
      properties:
        subnetId: { type: integer }
        network: { type: string, example: 10.1.0.0/24 }
        size: { type: integer, description: Number of addresses }
        reserved: { type: array, items: { type: integer }, description: 'Offsets of the network and broadcast addresses' }
        used:
          type: array
          items:
            type: object
            properties:
              offset: { type: integer }
              ip: { type: string }
              interfaceId: { type: integer }
              host: { oneOf: [ { $ref: '#/components/schemas/HostRef' }, { type: 'null' } ] }
        pools:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              start: { type: string }
              end: { type: string }
              startOffset: { type: integer }
              endOffset: { type: integer }

    DomainServer:
      type: object
      properties:
        id: { type: integer }
        domain: { $ref: '#/components/schemas/Ref' }
        server: { $ref: '#/components/schemas/HostRef' }
        role: { type: string, enum: [master, slave, forward] }
        rebuildPending: { type: boolean }

    Tag:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        target:
          type: object
          properties:
            kind: { type: string, enum: [host, subnet] }
            id: { type: integer }

    Message:
      type: object
      properties:
        id: { type: integer }
        target:
          type: object
          properties:
            kind: { type: string, enum: [host, subnet] }
            id: { type: integer }
            name: { type: [string, 'null'], description: The host's FQDN or the subnet's name }
        priority: { type: integer, enum: [0, 1, 2, 3] }
        priorityName: { type: string, enum: [info, high, medium, low] }
        message: { type: string }
        username: { type: string }
        createdAt: { type: string }
        expiration: { type: [string, 'null'] }
        expired: { type: boolean }

    Config:
      type: object
      properties:
        id: { type: integer }
        host: { $ref: '#/components/schemas/HostRef' }
        type: { $ref: '#/components/schemas/Ref' }
        md5: { type: string }
        size: { type: integer, description: Bytes }
        createdAt: { type: string }

    ConfigDetail:
      allOf:
        - $ref: '#/components/schemas/Config'
        - type: object
          properties:
            text: { type: string }

    LogEntry:
      type: object
      properties:
        id: { type: integer }
        timestamp: { type: string }
        username: { type: string }
        remoteAddr: { type: string }
        context: { type: string }
        message: { type: string }

    ReferenceCommon:
      type: object
      properties:
        id: { type: integer }
        inUse: { type: integer, description: Records using this row; it can only be deleted at 0 }
        system: { type: boolean, description: Built in; can't be changed or deleted }

    Manufacturer:
      allOf:
        - $ref: '#/components/schemas/ReferenceCommon'
        - { type: object, properties: { name: { type: string } } }
    Model:
      allOf:
        - $ref: '#/components/schemas/ReferenceCommon'
        - { type: object, properties: { name: { type: string }, manufacturerId: { type: integer }, snmpSysObjectId: { type: string } } }
    Role:
      allOf:
        - $ref: '#/components/schemas/ReferenceCommon'
        - { type: object, properties: { name: { type: string } } }
    DeviceTypeRecord:
      allOf:
        - $ref: '#/components/schemas/ReferenceCommon'
        - type: object
          properties:
            modelId: { type: integer }
            roleId: { type: integer }
            name: { type: string, example: Cisco 2821 (router) }
            manufacturer: { type: string }
            model: { type: string }
            role: { type: string }
    SubnetType:
      allOf:
        - $ref: '#/components/schemas/ReferenceCommon'
        - { type: object, properties: { name: { type: string }, shortName: { type: string }, notes: { type: string } } }
    ConfigType:
      allOf:
        - $ref: '#/components/schemas/ReferenceCommon'
        - { type: object, properties: { name: { type: string, example: IOS_CONFIG } } }
    DnsView:
      allOf:
        - $ref: '#/components/schemas/ReferenceCommon'
        - { type: object, properties: { name: { type: string, example: DEFAULT }, description: { type: string } } }

    SearchResult:
      type: object
      properties:
        query: { type: string }
        bestMatch:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                type: { type: string, enum: [host, subnet] }
                id: { type: integer }
        hosts: { type: array, items: { $ref: '#/components/schemas/Host' } }
        subnets: { type: array, items: { $ref: '#/components/schemas/Subnet' } }
        interfaces: { type: array, items: { $ref: '#/components/schemas/Interface' } }
        dnsRecords: { type: array, items: { $ref: '#/components/schemas/DnsRecord' } }
